<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon – Thug Coding®</title>

  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./pages.css" />

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* === Banner Background (same as Kingdom) === */
    .page-banner {
      position: relative;
      width: 100%;
      height: 250px;
      background: url('./images/Loo.png') no-repeat center center;
      background-size: cover;
      overflow: hidden;
    }

    .page-banner .logo {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 350px;
      height: auto;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .page-banner .logo {
        position: relative;
        display: block;
        margin: 20px auto 0;
        width: 250px;
      }
    }

    /* === Content Section === */
    .comingsoon-page {
      min-height: calc(100vh - 250px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
    }

    .comingsoon-page h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .comingsoon-page p {
      font-size: 1.2rem;
      color: #ccc;
      max-width: 600px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }

    .buttons a {
      background: white;
      color: black;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .buttons a:hover {
      background: #ccc;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .comingsoon-page h1 { font-size: 2rem; }
      .comingsoon-page p { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- === Banner with Background and Logo === -->
  <header class="page-banner">
    <img src="./images/THUGCODING_LOGO.png" alt="Thug Coding Logo" class="logo" />
  </header>

  <!-- === Under-Construction Message === -->
  <section class="comingsoon-page">
    <h1>🛠 Under Construction</h1>
    <p>
      This page is part of a future expansion of the Thug Coding<sup>®</sup> Kingdom.<br>
      It’s not active yet — but something powerful is coming soon.
    </p>

    <div class="buttons">
      <a href="./index.html">← Back to Home</a>
      <a href="https://getitfrommike.com/collections/all" target="_blank">🛍 Visit Store</a>
    </div>
  </section>

</body>
</html>
