<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You – Thug Coding®</title>

  <!-- Shared Styles -->
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../pages.css" />

  <!-- Page-Specific Styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      font-family: "Arial", sans-serif;
    }

    /* === Banner Background (same as Kingdom) === */
    .page-banner {
      position: relative;
      width: 100%;
      height: 250px;
      background: url('../images/Loo.png') no-repeat center center;
      background-size: cover;
      overflow: hidden;
    }

    .page-banner .logo {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 350px;
      height: auto;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .page-banner .logo {
        position: relative;
        display: block;
        margin: 20px auto 0;
        width: 250px;
      }
    }

    .thankyou-page {
      min-height: calc(100vh - 250px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
    }

    .thankyou-logo {
      width: 350px;
      max-width: 80%;
      height: auto;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .thankyou-page h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      animation: fadeIn 1.8s ease-in-out;
    }

    .thankyou-page p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 35px;
      color: #ccc;
      line-height: 1.6;
      animation: fadeIn 2.4s ease-in-out;
    }

    .thankyou-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      animation: fadeIn 3s ease-in-out;
    }

    .thankyou-buttons a {
      background: white;
      color: black;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .thankyou-buttons a:hover {
      background: #ccc;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .thankyou-page h1 { font-size: 2rem; }
      .thankyou-page p { font-size: 1rem; }
    }
  </style>
</head>

<body>

  <!-- === Banner Section (same style as Kingdom) === -->
  <header class="page-banner">
    <img src="../images/THUGCODING_LOGO.png" alt="Thug Coding Logo" class="logo" />
  </header>

  <!-- === Thank You Content === -->
  <section class="thankyou-page">
    <h1>Thank You!</h1>
    <p>
      Your submission has been received.<br>
      The Thug Coding<sup>®</sup> team will contact you soon.
    </p>

    <!-- 🛒 Buttons -->
    <div class="thankyou-buttons">
      <a href="../index.html">← Back to Home</a>
      <a href="https://getitfrommike.com/collections/all" target="_blank">🛍 Visit Shop</a>
    </div>
  </section>

</body>
</html>
